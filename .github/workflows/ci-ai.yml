name: CI - AI

on:
  workflow_dispatch:

  push:
    branches: [dev, main]
    paths:
      - "ai-model/**"
      - ".github/workflows/**"

  pull_request:
    branches: [dev, main]
    paths:
      - "ai-model/**"
      - ".github/workflows/**"

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: visign-uit/visign-gitops/.github/workflows/reusable-service-ci.yml@main
    with:
      project: visign
      service: ai
      service_type: python
      context_path: ai-model
      dockerfile_path: ai-model/Dockerfile
      image_name: visign-ai
      torch_compute: cpu
      migration_enabled: false
      migration_image_name: ""
      migration_dockerfile_path: ""
      migration_build_target: ""
      gitops_values_dev: projects/visign/environments/dev/ai.values.yaml
      gitops_values_prod: projects/visign/environments/prod/ai.values.yaml
    secrets: inherit
