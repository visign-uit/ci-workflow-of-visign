apiVersion: batch/v1
kind: Job
metadata:
  name: visign-db-migrate
  namespace: visign-dev
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: visign-db-migrate
          image: visignnonprodacrpakerb.azurecr.io/visign-db-migrate:dev-pg2
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: visign-secrets
                  key: DATABASE_URL
